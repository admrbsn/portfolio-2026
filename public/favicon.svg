<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Adam Robertson">
  <!--
    The wordmark's accent dot, at icon scale: the same green to yellow ramp the
    display type uses for its full stop (the compact gradient, tuned for short
    runs, which a 64px circle is exactly).

    Hex rather than oklch, because this file is rasterised by librsvg via sharp
    and that does not resolve CSS Color 4. The stops are the accent, the ramp's
    mid stop and the warm accent, converted with src/lib/color.ts. Re-derive
    them there if the palette moves.

    No tile behind it: in a row of square favicons a bare circle is the thing
    that reads as different, and transparency lets it sit on whatever the
    browser's tab strip is doing.
  -->
  <defs>
    <linearGradient id="dot" x1="6" y1="52" x2="58" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8cd472" />
      <stop offset="0.45" stop-color="#b1d864" />
      <stop offset="1" stop-color="#dedb5a" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#dot)" />
</svg>
