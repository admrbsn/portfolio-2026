[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >=22.12.0.
  NODE_VERSION = "22"
  # Netlify only autodetects Bun from a `bun.lockb`, but Bun 1.2+ writes a text
  # `bun.lock`. Pinning the version here forces Bun into the build image
  # regardless of lockfile format.
  BUN_VERSION = "1.3.0"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    # Astro content-hashes everything under /_astro, so it is safe to pin.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
